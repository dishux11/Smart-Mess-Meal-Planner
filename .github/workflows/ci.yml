name: CI

# M3 deliverable: GitHub Actions continuous integration.
# Runs on every push and pull request: installs deps, runs white-box unit tests
# and black-box API tests, and reports coverage.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # node:sqlite (built-in) requires Node >= 22.5
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: White-box unit tests (prediction logic)
        run: npm run test:unit

      - name: Black-box API tests (opt-out & cutoff rules)
        run: npm run test:api

      - name: Full suite with coverage
        run: npx jest --coverage --runInBand --forceExit

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: ignore
